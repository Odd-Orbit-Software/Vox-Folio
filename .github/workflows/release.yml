name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # Enact treats lint warnings as errors when CI is set; real lint errors still fail the build.
        env:
          CI: false
      - run: npx -y -p @webos-tools/cli ares-package dist -o build
      - name: Homebrew Channel manifest
        run: |
          IPK=$(ls build/*.ipk)
          tools/hbchannel-manifest.sh "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$IPK")"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.ipk
            build/*.manifest.json
          generate_release_notes: true
