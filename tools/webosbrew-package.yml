# The Homebrew Channel listing for Vox Folio, for a pull request to github.com/webosbrew/apps-repo as
# packages/software.oddorbit.voxfolio.yml. manifestUrl follows the latest release, so new releases need no
# further pull request.
title: Vox Folio
iconUri: https://raw.githubusercontent.com/Odd-Orbit-Software/Vox-Folio/main/webos-meta/largeIcon.png
manifestUrl: https://github.com/Odd-Orbit-Software/Vox-Folio/releases/latest/download/software.oddorbit.voxfolio.manifest.json
category: multimedia
pool: main
shortDescription: An Audiobookshelf audiobook and podcast player for the TV
description: |
  Vox Folio plays your own [Audiobookshelf](https://www.audiobookshelf.org) library on an LG TV and keeps
  your place in step with your other devices.

  - Chapters, bookmarks, a sleep timer that fades out, and speeds from 0.5× to 2× with natural pitch
  - Live sync with the Audiobookshelf app and others, with an undo
  - Library filters, series, authors, collections, playlists that play in order, and search
  - Podcasts, with new episodes and mark played
  - Profiles for everyone in the house, listening stats and Year in Review
  - Works entirely from the remote, with a guide to the coloured buttons

  You need your own Audiobookshelf server. [Documentation](https://odd-orbit-software.github.io/Vox-Folio/)
